[package]
name = "resque-bench"
version = "0.1.1"
edition = "2021"

[lib]
name = "resque_bench"
path = "src/lib.rs"

[[bin]]
name = "resque-bench"
path = "src/main.rs"

[dependencies]
# Redis client — plain RPUSH/LPOP, no blocking commands (matches Resque's real wire
# protocol; see README "Protocol compatibility" for exact source citations).
# tls-rustls-webpki-roots bundles Mozilla root CAs so TLS works without OS ca-certificates.
redis = { version = "1", features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Latency histogram
hdrhistogram = "7"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization — Resque job envelope is plain JSON ({"class": ..., "args": [...]})
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# Table formatting
comfy-table = "7"

# Time formatting
chrono = { version = "0.4", features = ["serde"] }

# URL parsing — safe password encoding and redaction
url = "2"

[dev-dependencies]
# Only needed to drive the redis::aio::Monitor stream in tests/ (proving the
# real wire traffic is LPOP/RPUSH-only, no blocking variant) — not used by
# the shipped binary.
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
