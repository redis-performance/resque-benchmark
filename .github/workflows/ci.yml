name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Build, lint, test, smoke
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Build
        run: cargo build --release

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Guard tls-rustls-insecure feature stays enabled
        # --insecure (REDIS_TLS_INSECURE) silently becomes a no-op if this
        # Cargo feature is ever dropped from the `redis` dependency (e.g. a
        # future dependency edit) — the URL's `#insecure` fragment still
        # parses fine either way, so all existing tests would stay green.
        # Fail CI loudly instead of letting that regress silently.
        run: |
          cargo tree -e features -i redis --workspace | grep -q tls-rustls-insecure || {
            echo "::error::tls-rustls-insecure feature is no longer enabled on the redis crate — --insecure/REDIS_TLS_INSECURE would silently become a no-op"
            exit 1
          }

      - name: Unit + integration tests
        # tests/idle_poll_integration.rs drives real PollWorker/producer code
        # against the `redis` service above (db 15, distinct from the smoke
        # test's db 0 below) — enqueues real jobs, drains them with real
        # workers, and asserts idle_poll_qps lands within tolerance of
        # workers * 1000 / poll_interval_ms as an automated regression
        # check, plus a MONITOR-based check that only LPOP/RPUSH ever hit
        # the wire (no blocking variant).
        run: cargo test
        env:
          REDIS_URL: redis://127.0.0.1:6379/15

      - name: Smoke test (end-to-end against Redis service)
        run: |
          cargo run --release -- \
            --url redis://127.0.0.1:6379/0 \
            --workers 2 \
            --jobs 500 \
            --poll-interval-ms 100 \
            --idle-poll-duration-s 3 \
            --timeout 60 \
            --output /tmp/smoke.json \
            --quiet \
            --tag smoke
          # Verify the run completed all jobs without timing out, and that the
          # idle-poll phase produced a plausible LPOP/s figure (workers * 1/poll-interval).
          jq -e '
            .results[0].total_jobs == 500 and
            .results[0].timed_out == false and
            .results[0].errors == 0 and
            .results[0].latency_us.total_count == 500 and
            .results[0].idle_poll.total_lpop_calls > 0 and
            .results[0].idle_poll.idle_poll_qps > 0
          ' /tmp/smoke.json

      - name: Real TLS handshake smoke test (self-signed cert)
        # The redis:8.6 `services` container above only exposes a plaintext port — it
        # proves nothing about --tls/--insecure, which is what actually broke end-to-end
        # (see the CryptoProvider panic fixed in this PR). This step stands up a
        # dedicated TLS-only redis-server with a throwaway self-signed cert and drives
        # the real built binary against it both ways:
        #   - without --insecure: must fail cleanly with a certificate error (the
        #     self-signed cert isn't trusted), and MUST NOT panic — a naive fix could
        #     leave the CryptoProvider-missing panic in place for the verifying path.
        #   - with --insecure: must complete a full run over the TLS connection, and
        #     must print the insecure-mode warning on stderr.
        run: |
          set -euo pipefail

          command -v redis-server >/dev/null || { sudo apt-get update && sudo apt-get install -y redis-server; }
          command -v openssl >/dev/null || { sudo apt-get update && sudo apt-get install -y openssl; }

          mkdir -p /tmp/tls
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/tls/key.pem -out /tmp/tls/cert.pem -days 1 -subj /CN=localhost

          redis-server \
            --port 0 \
            --tls-port 16391 \
            --tls-cert-file /tmp/tls/cert.pem \
            --tls-key-file /tmp/tls/key.pem \
            --tls-ca-cert-file /tmp/tls/cert.pem \
            --tls-cluster no --tls-replication no --tls-auth-clients no \
            --daemonize yes \
            --pidfile /tmp/tls/redis.pid \
            --logfile /tmp/tls/redis.log \
            --dir /tmp/tls
          for i in $(seq 1 10); do
            [ -f /tmp/tls/redis.pid ] && break
            sleep 0.5
          done
          sleep 1
          cat /tmp/tls/redis.log

          echo "=== without --insecure: must fail cleanly on the untrusted cert, not panic ==="
          set +e
          ./target/release/resque-bench \
            --url rediss://127.0.0.1:16391/0 \
            --workers 1 --jobs 5 --poll-interval-ms 100 --idle-poll-duration-s 1 --timeout 5 \
            --quiet --tag ci-tls --output - \
            >/tmp/tls_verify.out 2>/tmp/tls_verify.err
          status=$?
          set -e
          cat /tmp/tls_verify.err
          if [ "$status" -eq 0 ]; then
            echo "::error::expected a non-zero exit connecting without --insecure against a self-signed cert, got success"
            exit 1
          fi
          if grep -qi "panic" /tmp/tls_verify.err; then
            echo "::error::binary panicked instead of failing cleanly with a certificate error — see /tmp/tls_verify.err"
            exit 1
          fi

          echo "=== with --insecure: must complete a real run over the TLS connection ==="
          ./target/release/resque-bench \
            --url rediss://127.0.0.1:16391/0 --insecure \
            --workers 2 --jobs 200 --poll-interval-ms 100 --idle-poll-duration-s 1 --timeout 10 \
            --quiet --tag ci-tls --output /tmp/tls_insecure.json \
            2>/tmp/tls_insecure.err
          cat /tmp/tls_insecure.err
          grep -q "TLS certificate verification is DISABLED" /tmp/tls_insecure.err || {
            echo "::error::expected the insecure-mode warning on stderr when --insecure is passed"
            exit 1
          }
          jq -e '
            .results[0].total_jobs == 200 and
            .results[0].timed_out == false and
            .results[0].errors == 0
          ' /tmp/tls_insecure.json

          redis-cli -p 16391 --tls --insecure --cacert /tmp/tls/cert.pem shutdown nosave || true
